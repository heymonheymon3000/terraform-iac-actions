# Workflow Name
name: "infra-gitops"

# Workflow Triggers
on:
  push:
    branches:
      - iac-actions
    paths:
      - terraform/**
  workflow_dispatch: # Enables manual trigger for destroy job

permissions:
  id-token: write # Required for OIDC
  contents: read

# Environment Variables
env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  S3_BUCKET: ${{ secrets.S3_BUCKET }}
  ROLE_GITHUB_ACTION: ${{ secrets.ROLE_GITHUB_ACTION }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  EKS_CLUSTER: ${{ vars.EKS_CLUSTER }}
  ECR_REPO: ${{ vars.ECR_REPO }}

# Define Jobs
jobs:
  terraform:
    name: "Deploy Infra with Terraform on AWS"
    runs-on: ubuntu-latest
    # Run only on push events
    if: github.event_name == 'push'

    defaults:
      run:
        shell: bash
        working-directory: ./terraform

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform init
        id: init
        run: terraform init -backend-config="bucket=$S3_BUCKET"

      - name: Terraform validate
        id: validate
        run: terraform validate

      - name: Terraform plan
        id: plan
        run: terraform plan -no-color -input=false -out planfile
        continue-on-error: true

      - name: Terraform plan status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Terraform apply
        id: apply
        run: terraform apply -auto-approve -input=false -parallelism=1 planfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.ROLE_GITHUB_ACTION }}
          # aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          # aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Additional steps
        run: |
          # Your commands that require AWS credentials
          aws sts get-caller-identity

      - name: Get Kubernetes config
        id: getconfig
        if: steps.apply.outcome == 'success'
        run: |
          set -euo pipefail
          aws eks update-kubeconfig --name "${{ env.EKS_CLUSTER }}" --region "${{ env.AWS_REGION }}" --assume-role-arn "${{ env.ROLE_GITHUB_ACTION }}"
          kubectl config current-context
          kubectl get namespace kube-system

      - name: Install Ingress controller
        if: steps.apply.outcome == 'success' && steps.getconfig.outcome == 'success'
        run: kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.12.0-beta.0/deploy/static/provider/aws/deploy.yaml

  destroy:
    name: "Destroy Infra on AWS"
    runs-on: ubuntu-latest
    # Only trigger for workflow_dispatch
    if: github.event_name == 'workflow_dispatch'

    defaults:
      run:
        shell: bash
        working-directory: ./terraform

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform init
        id: init
        run: terraform init -backend-config="bucket=$S3_BUCKET"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.ROLE_GITHUB_ACTION }}
          # aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          # aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Additional steps
        run: |
          # Your commands that require AWS credentials
          aws sts get-caller-identity

      - name: Get Kubernetes config
        id: getconfig
        continue-on-error: true
        run: |
          set -euo pipefail

          if [[ -z "${{ env.EKS_CLUSTER }}" || -z "${{ env.AWS_REGION }}" ]]; then
            echo "EKS_CLUSTER or AWS_REGION missing; skipping kubeconfig update."
            exit 0
          fi

          if ! command -v aws >/dev/null 2>&1; then
            echo "aws CLI not installed; cannot update kubeconfig."
            exit 0
          fi

          echo "Validating EKS cluster exists..."
          if ! aws eks describe-cluster --name "${{ env.EKS_CLUSTER }}" --region "${{ env.AWS_REGION }}" >/dev/null 2>&1; then
            echo "EKS cluster '${{ env.EKS_CLUSTER }}' not accessible in '${{ env.AWS_REGION }}'; skipping kubeconfig update."
            exit 0
          fi

          echo "Cluster validated; updating kubeconfig..."
          aws eks update-kubeconfig --name "${{ env.EKS_CLUSTER }}" --region "${{ env.AWS_REGION }}"

      - name: Delete Ingress controller
        id: delete_ingress
        if: steps.getconfig.outcome == 'success'
        run: |
          if kubectl get namespace ingress-nginx >/dev/null 2>&1; then
            echo "Ingress namespace exists, deleting controller"
            kubectl delete -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.12.0-beta.0/deploy/static/provider/aws/deploy.yaml
          else
            echo "Ingress controller not present, skipping delete"
          fi

      - name: Empty ECR Repository
        id: ecr_cleanup
        if: ${{ env.ECR_REPO != '' && env.ECR_REPO != null }}
        run: |
          set -euo pipefail

          REPOSITORY_NAME=${{ env.ECR_REPO }}

          if ! aws ecr describe-repositories --repository-names "$REPOSITORY_NAME" >/dev/null 2>&1; then
            echo "ECR repository '$REPOSITORY_NAME' does not exist; skipping cleanup."
            exit 0
          fi

          IMAGES=$(aws ecr list-images --repository-name "$REPOSITORY_NAME" --query 'imageIds[*]' --output json)
          if [[ -z "$IMAGES" || "$IMAGES" == "null" || "$IMAGES" == "[]" ]]; then
            echo "No images found in '$REPOSITORY_NAME'."
            exit 0
          fi

          echo "Deleting images from '$REPOSITORY_NAME': $IMAGES"
          aws ecr batch-delete-image --repository-name "$REPOSITORY_NAME" --image-ids "$IMAGES"

      - name: Terraform destroy
        id: destroy
        run: terraform destroy -auto-approve -input=false
